<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: scouting notebook. Sticky tab bar; summary first (Bilan), then the match log as list + detail, the meta board, the player's own habits, and the rulebook. Same family as the deck workshop. */
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --surface-2: #e9ebf2;
  --ink: #151826;
  --ink-2: #474b60;
  --muted: #6d7189;
  --line: #d9dce7;
  --accent: #0d7a6b;
  --accent-ink: #ffffff;
  --accent-soft: #d6efea;
  --win: #11823b;
  --win-soft: #dcf2e3;
  --loss: #c22f2f;
  --loss-soft: #fbe3e3;
  --warn: #9a6400;
  --warn-soft: #fff1d6;
  --grid: #e3e4ec;
  --el-fire: #eb6834;
  --el-water: #2a78d6;
  --el-earth: #a0521c;
  --el-nature: #1baf7a;
  --el-light: #c98500;
  --el-shadow: #4a3aa7;
  --el-divine: #d6336c;
  --rar-c: #6d7189;
  --rar-r: #2363c4;
  --rar-e: #8a3fc7;
  --rar-l: #9a6400;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --r-s: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1118; --surface: #171a24; --surface-2: #20242f; --ink: #eef0f7; --ink-2: #b8bccf; --muted: #8b90a8; --line: #2b3040;
    --accent: #2fc2ad; --accent-ink: #062521; --accent-soft: #123a35; --win: #46c46a; --win-soft: #15301f; --loss: #f07070; --loss-soft: #3a1c1c;
    --warn: #f0b429; --warn-soft: #3a2e12; --grid: #262a36;
    --el-fire: #d95926; --el-water: #3987e5; --el-earth: #b5651d; --el-nature: #199e70; --el-light: #c98500; --el-shadow: #9085e9; --el-divine: #ec5f93;
    --rar-c: #8b90a8; --rar-r: #6ea8f5; --rar-e: #c09af5; --rar-l: #f0b429;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1118; --surface: #171a24; --surface-2: #20242f; --ink: #eef0f7; --ink-2: #b8bccf; --muted: #8b90a8; --line: #2b3040;
  --accent: #2fc2ad; --accent-ink: #062521; --accent-soft: #123a35; --win: #46c46a; --win-soft: #15301f; --loss: #f07070; --loss-soft: #3a1c1c;
  --warn: #f0b429; --warn-soft: #3a2e12; --grid: #262a36;
  --el-fire: #d95926; --el-water: #3987e5; --el-earth: #b5651d; --el-nature: #199e70; --el-light: #c98500; --el-shadow: #9085e9; --el-divine: #ec5f93;
  --rar-c: #8b90a8; --rar-r: #6ea8f5; --rar-e: #c09af5; --rar-l: #f0b429;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 0 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; letter-spacing: .01em; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.wrap { max-width: 1280px; margin: 0 auto; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 12px 16px 0; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 1.35rem; letter-spacing: .02em; }
.brand h1 b { color: var(--accent); font-weight: 700; }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px 10px; font-family: var(--font-display); font-weight: 600; font-size: .95rem; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-body); font-weight: 400; color: var(--muted); margin-left: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack-s { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.sec { margin-top: 16px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 12px; }
.sec-head p { color: var(--ink-2); font-size: .9rem; max-width: 70ch; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.note { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 12px; font-size: .9rem; color: var(--ink-2); }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.empty { color: var(--muted); padding: 8px 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r-s); font-size: .9rem; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.danger { color: var(--loss); }
.btn:disabled { opacity: .5; cursor: default; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 7px 10px; min-width: 0; width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: .85rem; white-space: nowrap; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; background: var(--muted); }
.dot.fire { background: var(--el-fire); } .dot.water { background: var(--el-water); } .dot.earth { background: var(--el-earth); }
.dot.nature { background: var(--el-nature); } .dot.light { background: var(--el-light); } .dot.shadow { background: var(--el-shadow); } .dot.divine { background: var(--el-divine); }
.cc { display: inline-flex; align-items: center; gap: 5px; font-size: .86rem; white-space: nowrap; }
.cc .t { font-size: .7rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.cards-row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.res { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 4px; font-family: var(--font-display); font-weight: 700; font-size: .85rem; }
.res.V { background: var(--win-soft); color: var(--win); }
.res.D { background: var(--loss-soft); color: var(--loss); }
.res.N { background: var(--surface-2); color: var(--ink-2); }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--win-soft); color: var(--win); }
.badge.hyp { background: var(--warn-soft); color: var(--warn); }
.badge.no { background: var(--loss-soft); color: var(--loss); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; min-width: 0; }

/* Bilan */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--surface); }
.tile .lab { font-size: .8rem; color: var(--muted); }
.tile .val { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1.05; }
.tile .hint { font-size: .82rem; color: var(--ink-2); }
.form-strip { display: flex; flex-wrap: wrap; gap: 4px; }
.form-strip button { border: 0; padding: 0; background: none; }
.pipeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; counter-reset: step; }
.pipeline li { border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; font-size: .9rem; color: var(--ink-2); counter-increment: step; }
.pipeline li::before { content: counter(step); display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .8rem; margin-right: 8px; }
.pipeline b { color: var(--ink); }

/* Parties */
.log { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; }
@media (max-width: 880px) { .log { grid-template-columns: minmax(0, 1fr); } }
.mlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.mitem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; }
.mitem:hover { background: var(--surface-2); }
.mitem[aria-current="true"] { background: var(--accent-soft); }
.mitem .res { grid-row: 1 / 3; align-self: center; }
.mitem .l1 { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.mitem .l2 { font-size: .82rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.detail-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.detail-head h2 { font-size: 1.3rem; }
.sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 600px) { .sides { grid-template-columns: minmax(0, 1fr); } }
.side { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
/* Déroulé (one block per turn, the two half-turns side by side, stacked when narrow) and shop visits */
.tn { font-family: var(--font-display); font-weight: 700; }
.who { font-family: var(--font-display); font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tl, .shop { list-style: none; margin: 0; padding: 0; }
.tl { container-type: inline-size; }
.turn, .sv { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.turn-h, .sv-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.halves { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 16px; }
@media (max-width: 600px) { .halves { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 640px) { .halves { grid-template-columns: minmax(0, 1fr); } }
.half { border-left: 3px solid var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.half.me { border-left-color: var(--accent); }
.half.me .who, .sv.me .who { color: var(--accent); }
.half-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: .8rem; }
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: .88rem; overflow-wrap: anywhere; }
.acts .pas { color: var(--muted); font-size: .82rem; }
.acts .ko { font-weight: 700; }
.turn.inferred .acts { color: var(--muted); font-style: italic; }
.turn-note { color: var(--ink-2); }
.sv-what { font-size: .92rem; overflow-wrap: anywhere; }
.tox { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
.tox.bought { font-weight: 700; }
.tox .pr { color: var(--muted); font-size: .78rem; font-weight: 400; }
.rar { font-size: .66rem; font-weight: 700; line-height: 1.25; padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; }
.rar.C { color: var(--rar-c); } .rar.R { color: var(--rar-r); } .rar.E { color: var(--rar-e); } .rar.L { color: var(--rar-l); }
details.offers summary { cursor: pointer; font-size: .85rem; color: var(--accent); width: max-content; max-width: 100%; }
details.offers ol { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
details.offers li { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: baseline; gap: 2px 8px; font-size: .86rem; }
details.offers .ol { color: var(--muted); font-size: .78rem; }
details.offers .ox { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mist { border-left: 3px solid var(--warn); padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; font-size: .9rem; }
.mist.high { border-left-color: var(--loss); }
.mist.low { border-left-color: var(--line); }
.mist .better { color: var(--ink-2); }
.good { border-left: 3px solid var(--win); padding: 6px 10px; font-size: .9rem; }
.bullets { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: .92rem; }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* Méta */
.arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .arch-grid { grid-template-columns: minmax(0, 1fr); } }
.arch { border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--surface); }
.arch.seen { border-color: var(--accent); }
.arch h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.arch .plan { font-size: .88rem; color: var(--ink-2); }
.arch ul { margin: 0; padding-left: 18px; font-size: .86rem; display: flex; flex-direction: column; gap: 3px; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 210px) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .86rem; }
@media (max-width: 480px) { .bar-row { grid-template-columns: minmax(0, 1fr) 54px; } .bar-row .track { grid-column: 1 / -1; grid-row: 2; } }
.bar-row .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 14px; background: var(--surface-2); border-radius: 3px; display: flex; overflow: hidden; }
.track i { display: block; height: 100%; }
.track i.w { background: var(--win); } .track i.l { background: var(--loss); } .track i.a { background: var(--accent); } .track i.m { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.watch { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.watch .w { border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; font-size: .84rem; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.watch .w b { font-family: var(--font-display); }

/* Mon jeu / Savoir */
.spark svg { display: block; width: 100%; height: auto; overflow: visible; }
.spark text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.check li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: .92rem; align-items: start; }
.check li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-top: 4px; }
.kn { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.kn .h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.kn .h b { font-family: var(--font-display); font-weight: 600; }
.kn p { font-size: .92rem; color: var(--ink-2); max-width: 80ch; }
/* Screenshots of older matches, certainty badges */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.gallery button { border: 0; padding: 0; background: none; cursor: zoom-in; }
.gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--line); display: block; background: var(--surface-2); }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 16, .9); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; border: 0; width: 100%; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
.cert { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; font-style: normal; }
.cert.seen { background: var(--win-soft); color: var(--win); }
.cert.forced { background: var(--accent-soft); color: var(--accent); }
.cert.likely { background: var(--warn-soft); color: var(--warn); }
.cert.guess { background: var(--loss-soft); color: var(--loss); }
.basis { display: block; font-size: .78rem; color: var(--muted); font-style: normal; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-align: left; }
.linkish:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main class="wrap">

<script>
(() => {
'use strict';
const EL = { fire: 'Feu', water: 'Eau', earth: 'Terre', nature: 'Nature', light: 'Lumière', shadow: 'Ombre', divine: 'Divin' };
const RES = { V: 'Victoire', D: 'Défaite', N: 'Nul' };
const CAT = {
  ordre: ["Ordre d'activation", 'Chaque tour : générateurs, puis buffs, puis attaques. Les frappes du tour profitent tout de suite du bonus.'],
  ciblage: ['Ciblage', "Avant d'attaquer : quelle carte adverse lance sa grosse capacité au prochain tour, et laquelle a une résistance négative à mon élément ?"],
  tempo: ['Tempo et recharges', "Compter les recharges adverses. Garder Gel, Étourdissement et Éternité pour le tour qui précède leur gros coup."],
  boutique: ['Boutique', "Tours pairs : une famille utile (Cœur de mon élément, Berserk, Poison) sur la bonne ligne, sinon passer (+10 Spamtons)."],
  economie: ['Économie', 'Ne pas dormir sur les Spamtons : acheter tôt, garder 15 pour une relance.'],
  defense: ['Défense', "Provocation et soins sur la carte clé avant le gros coup adverse. Ne jamais soigner une carte gelée."],
  lecture: ["Lecture de l'adversaire", "Au tour 1, lire les 4 cartes adverses : quel est leur moteur, quelle est leur carte clé, quand arrive leur pic ?"],
  deck: ['Choix du deck', "Choisir le deck selon la méta du moment (onglet Méta) et non par habitude."],
  ban: ['Ban du shop', "Bannir l'élément du shop qui sert le plus l'adversaire, jamais ta propre réponse (Brut, Éternité, Gel) : le ban vaut pour les deux joueurs."]
};
const COST = { élevé: 3, moyen: 2, faible: 1 };
const KIND = { mécanique: 'Mécaniques', économie: 'Économie et boutique', carte: 'Cartes', tox: 'Tox', adversaire: 'Adversaires', méta: 'Méta', jeu: 'Mon style de jeu' };
const STATUS = { confirmé: 'ok', hypothèse: 'hyp', réfuté: 'no', théorique: 'acc', observé: 'ok', émergent: 'hyp', établi: 'ok' };
const nf = new Intl.NumberFormat('fr-FR');
const pct = x => nf.format(Math.round(x)) + ' %';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const S = { cards: [], byN: new Map(), byName: new Map(), tox: {}, toxIds: {}, matches: [], know: [], arch: [], ready: { m: false, k: false, a: false },
  db: null, canWrite: null, view: 'bilan', sel: null, resFilter: 'all', deckFilter: '', kindFilter: 'all', kSearch: '', confirmDel: null };

/* ---------- Helpers ---------- */
const arr = x => Array.isArray(x) ? x : [];
const cardOf = v => typeof v === 'number' ? S.byN.get(v) : S.byName.get(String(v || '').toLowerCase());
function chip(v) {
  const c = cardOf(v);

  return `<span class="cc" title="${esc(`${EL[c.el] || c.el} · ${c.rar} · ${c.hp} PV`)}"><span class="dot ${c.el}"></span>${esc(c.name)}</span>`;
}
const chips = list => arr(list).length ? `<div class="cards-row">${arr(list).map(chip).join('')}</div>` : '<span class="muted small">Inconnues</span>';
const oppCards = m => arr(m.opp && m.opp.cards).concat(arr(m.opp && m.opp.unknown));
const myCards = m => arr(m.my && m.my.cards);
const deckKey = m => myCards(m).map(v => { const c = cardOf(v); return c ? c.n : v; }).sort((a, b) => String(a).localeCompare(String(b))).join('-');
const deckLabel = m => (m.my && m.my.deck) || myCards(m).map(v => (cardOf(v) || { name: v }).name).join(' · ') || 'Deck inconnu';
function fmtDate(iso) {
  const d = new Date(iso); if (isNaN(d)) return esc(iso || '');
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
const sorted = () => S.matches.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
const decided = list => list.filter(m => m.result === 'V' || m.result === 'D');
const wr = list => { const d = decided(list); return d.length ? 100 * d.filter(m => m.result === 'V').length / d.length : null; };
const wl = list => `${list.filter(m => m.result === 'V').length}-${list.filter(m => m.result === 'D').length}`;
function archOf(m) {

  let best = null, bestHits = 1;

  return best;
}
const mistakeWeight = m => arr(m.mistakes).reduce((s, x) => s + (COST[x.cost] || 2), 0);
const plural = (n, w) => `${nf.format(n)} ${w}${n > 1 ? 's' : ''}`;
/* Tox: ref/tox.json inlined by build_page.js, keyed by game id with rarity ("CoeurVital_R": name, rar, cost, text).
   Replays store these ids (shop[].tox, replaced, offers); bans and archetypes store the family id ("CoeurVital"). */
const RAR = { C: 'Commune', R: 'Rare', E: 'Épique', L: 'Légendaire' };
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function toxFam(v) {
  if (!v) return null; const t = S.tox; const s = String(v).trim();
  if (own(t, s)) return s; const id = s.replace(/_[CREL]$/, ''); if (own(t, id)) return id;
  const low = s.toLowerCase(); return Object.keys(t).find(k => t[k].name.toLowerCase() === low) || null;
}
/* Name, rarity, price and text of a stored Tox: game id, family id (its rarity given apart, as in bans.rarity), or a name kept as read. */
function toxInfo(v, rar) {
  const s = String(v == null ? '' : v).trim(); if (!s) return null;
  if (own(S.toxIds, s)) return S.toxIds[s];
  const r = own(RAR, rar) ? rar : (/_([CREL])$/.exec(s) || [])[1] || null, f = toxFam(s);
  if (!f) return { name: s, rar: r };
  return own(S.toxIds, f + '_' + r) ? S.toxIds[f + '_' + r] : { name: S.tox[f].name, rar: r };
}
const toxName = v => { const t = toxInfo(v); return t ? t.name : ''; };
function toxHtml(v, o = {}) {
  const t = toxInfo(v, o.rar); if (!t) return '';
  const tip = [t.name + (RAR[t.rar] ? ' ' + RAR[t.rar].toLowerCase() : ''), t.cost != null ? t.cost + ' Spamtons' : '', t.text, o.bought ? 'acheté' : ''].filter(Boolean).join(' · ');
  return `<span class="tox${o.bought ? ' bought' : ''}" title="${esc(tip)}">${o.bought ? '<span aria-hidden="true">✓</span><span class="sr">acheté :</span> ' : ''}${esc(t.name)}${RAR[t.rar] ? ` <span class="rar ${t.rar}">${t.rar}</span>` : ''}${o.price && t.cost != null ? ` <span class="pr num">${esc(t.cost)}</span>` : ''}</span>`;
}
/* Shop bans (schema in journal/README.md): none (no ban at all, established), mine/theirs (family ids), c, rarity {mine, theirs} as C/R/E/L, phase, order, sawOpp, lasts, seen. */
function bansHtml(m) {
  const b = m.bans; if (!b || typeof b !== 'object') return '';
  if (b.none === true) return `<div class="note small"><b>Bans du shop</b> · Aucun ban dans cette partie ${cert(b.c)}${b.seen ? `<span class="basis">${esc(b.seen)}</span>` : ''}</div>`;
  const r = b.rarity || {};
  const side = (v, k) => v ? toxHtml(v, { rar: k }) : '<span class="muted">?</span>';
  const extra = [b.phase && 'moment : ' + b.phase, b.order && 'ordre : ' + b.order,
    b.sawOpp === true ? 'ses 4 cartes étaient visibles au moment du ban' : b.sawOpp === false ? "ses 4 cartes n'étaient pas toutes visibles au moment du ban" : '',
    b.lasts && 'durée : ' + b.lasts, b.seen && 'constat : ' + b.seen].filter(Boolean).join(' · ');
  if (!b.mine && !b.theirs && !extra) return '';
  return `<div class="note small"><b>Bans du shop</b> · moi : ${side(b.mine, r.mine)} · adversaire : ${side(b.theirs, r.theirs)} ${cert(b.c)}${extra ? `<span class="basis">${esc(extra)}</span>` : ''}</div>`;
}
/* Where a match comes from (schema: source). "pc-perso@<sha7>" = a replay sent from the home PC, the only source since 2026-10-09.
   Older matches: "captures" (analysed in this page), "manuel" (typed in a form), or the name of a Pont import. */
const importName = m => m.source && !['captures', 'manuel'].includes(m.source) && !/^pc-perso@/.test(m.source) ? String(m.source) : '';

/* screens holds asset ids (shown as "/_blob/<id>"), or a URL kept as given by a server-side copy (anything with / or :). */
const blobSrc = id => /[/:]/.test(String(id)) ? String(id) : '/_blob/' + encodeURIComponent(id);

/* ---------- Boot ---------- */
async function boot() {
  try {
    S.cards = JSON.parse($('cards-data').textContent).cards;
    try { S.toxIds = JSON.parse($('tox-data').textContent) || {}; } catch (err) { S.toxIds = {}; }
    Object.entries(S.toxIds).forEach(([id, t]) => { const f = id.replace(/_[CREL]$/, ''); if (!S.tox[f]) S.tox[f] = { name: t.name }; });
  } catch (e) { $('view-bilan').innerHTML = `<p class="note warn sec">Les cartes n'ont pas pu être chargées (${esc(e.message)}). Recharge la page.</p>`; return; }
  S.cards.forEach(c => { S.byN.set(c.n, c); S.byName.set(c.name.toLowerCase(), c); if (c.en) S.byName.set(c.en.toLowerCase(), c); });
  initTabs(); initParties(); render();
  const last = store.get('spam-journal-view', 'bilan'); if (last !== 'bilan') setView(last);
  const w = window.claude;
  if (!w || !w.use) { dbMissing(); return; }
  w.use('user').then(u => { if (!u) return; Promise.resolve(u.can('data.write')).then(v => { S.canWrite = v; render(); }).catch(() => {}); }).catch(() => {});
  const db = await w.use('db').catch(() => null);
  if (!db) { dbMissing(); return; }
  S.db = db;
  const sub = (col, key, prop) => db.collection(col).onSnapshot(snap => {
    S[prop] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready[key] = true; render();
  }, err => { S.ready[key] = true; $('db-note').hidden = false; $('db-note').textContent = `Lecture du journal interrompue (${err.code}). Recharge la page.`; render(); });
  sub('matches', 'm', 'matches'); sub('knowledge', 'k', 'know'); sub('archetypes', 'a', 'arch');
}
function dbMissing() {
  $('db-note').hidden = false;
  $('db-note').textContent = "Le journal n'est pas accessible dans cette vue. Ouvre la page depuis claude.ai en étant connecté.";

}

/* ---------- Tabs ---------- */

}
function openMatch(id) { S.sel = id; S.resFilter = 'all'; S.deckFilter = ''; setView('parties'); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (b) { openMatch(b.dataset.open); return; }
  const z = e.target.closest('[data-zoom]'); if (z) openZoom(z.dataset.zoom);

/* ---------- Render ---------- */
function render() {
  const n = S.matches.length;
  $('c-parties').textContent = n ? n : '';
  $('c-meta').textContent = S.arch.length ? S.arch.length : '';
  $('c-savoir').textContent = S.know.length ? S.know.length : '';
  const w = wr(S.matches);
  $('subtitle').textContent = !S.ready.m ? 'Chargement du journal…' : n ? `${n} partie${n > 1 ? 's' : ''} · ${wl(S.matches)}${w != null ? ' · ' + pct(w) + ' de victoires' : ''}` : 'Aucune partie enregistrée pour l\'instant';

function emptyJournal() {
  return `<div class="panel sec stack">
    <div class="sec-head"><h2>Le journal est vide</h2><p>Chaque partie envoyée vient s'ajouter ici. Les onglets Méta et Savoir sont déjà remplis avec ce que l'on sait du jeu.</p></div>

      <li><b>Joue sur ton PC perso.</b> Le jeu garde un replay de chaque partie.</li>
      <li><b>Envoie le dossier des replays</b> après ta séance, par la branche pc-perso.</li>

/* Bilan */
function renderBilan() {
  const box = $('view-bilan');
  if (!S.ready.m) { box.innerHTML = '<p class="empty sec">Chargement du journal…</p>'; return; }
  const all = sorted();
  if (!all.length) { box.innerHTML = emptyJournal(); return; }
  const w = wr(all), firsts = all.filter(m => m.first === true), seconds = all.filter(m => m.first === false);
  const recent = all.slice(0, 5), before = all.slice(5, 15);
  const avgMist = list => list.length ? list.reduce((s, m) => s + arr(m.mistakes).length, 0) / list.length : null;
  const mr = avgMist(recent), mb = avgMist(before);
  const form = all.slice(0, 10).reverse();
  const decks = groupBy(all, deckKey).map(([, list]) => ({ label: deckLabel(list[0]), list })).sort((a, b) => b.list.length - a.list.length);

  box.innerHTML = `<div class="stack sec">
    <div class="tiles">

      <div class="tile"><span class="lab">Taux de victoire</span><span class="val num">${w == null ? '–' : pct(w)}</span><span class="hint">${all.length < 10 ? 'Encore peu de parties : à lire comme une tendance' : 'Sur ' + decided(all).length + ' parties terminées'}</span></div>
      <div class="tile"><span class="lab">Premier / second</span><span class="val num">${firsts.length ? pct(wr(firsts) ?? 0) : '–'} / ${seconds.length ? pct(wr(seconds) ?? 0) : '–'}</span><span class="hint">${firsts.length} en premier, ${seconds.length} en second</span></div>
      <div class="tile"><span class="lab">Erreurs par partie</span><span class="val num">${mr == null ? '–' : nf.format(Math.round(mr * 10) / 10)}</span><span class="hint">${mb == null ? 'Sur les 5 dernières parties' : mr < mb ? `En baisse (avant : ${nf.format(Math.round(mb * 10) / 10)})` : mr > mb ? `En hausse (avant : ${nf.format(Math.round(mb * 10) / 10)})` : 'Stable'}</span></div>
    </div>

    <div class="two">
      <div class="panel"><div class="sec-head"><h2>Tes decks</h2></div><div class="scroll-x"><table><thead><tr><th>Deck</th><th class="n">Parties</th><th class="n">V-D</th><th class="n">Victoires</th></tr></thead><tbody>
        ${decks.map(d => `<tr><td>${esc(d.label)}</td><td class="n">${d.list.length}</td><td class="n">${wl(d.list)}</td><td class="n">${wr(d.list) == null ? '–' : pct(wr(d.list))}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="panel"><div class="sec-head"><h2>Face aux archétypes</h2></div>${arches.length ? `<div class="scroll-x"><table><thead><tr><th>Archétype adverse</th><th class="n">Vu</th><th class="n">V-D</th></tr></thead><tbody>
        ${arches.map(a => `<tr><td>${esc(a.name)}</td><td class="n">${a.list.length}</td><td class="n">${wl(a.list)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Aucun adversaire rattaché à un archétype pour l\'instant.</p>'}</div>
    </div>
    <div class="two">
      <div class="panel"><div class="sec-head"><h2>À travailler</h2><p>Les catégories d'erreurs qui coûtent le plus, pondérées par leur gravité.</p></div>
        ${cats.length ? `<ul class="check">${cats.map(c => `<li><span><b>${esc(CAT[c.cat] ? CAT[c.cat][0] : c.cat)}</b> · ${c.count} fois<br><span class="muted small">${esc(CAT[c.cat] ? CAT[c.cat][1] : '')}</span></span></li>`).join('')}</ul>` : '<p class="empty">Aucune erreur relevée pour l\'instant.</p>'}</div>
      <div class="panel"><div class="sec-head"><h2>Dernières parties</h2></div><ul class="mlist">${recent.map(matchItem).join('')}</ul></div>

}
function groupBy(list, fn) { const m = new Map(); list.forEach(x => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return [...m.entries()]; }
function archStats(list) {
  const res = S.arch.map(a => ({ id: a.id, name: a.name, a, list: [] }));
  const other = { id: '', name: 'Non classé', a: null, list: [] };
  list.forEach(m => { const a = archOf(m); (a ? res.find(r => r.id === a.id) : other).list.push(m); });
  return other.list.length ? res.concat(other) : res;
}
function catStats(list) {
  const m = new Map();
  list.forEach(x => arr(x.mistakes).forEach(k => { const c = k.cat || 'autre'; const o = m.get(c) || { cat: c, count: 0, weight: 0 }; o.count++; o.weight += COST[k.cost] || 2; m.set(c, o); }));
  return [...m.values()].sort((a, b) => b.weight - a.weight);
}

/* Parties */
function matchItem(m) {
  const a = archOf(m);
  return `<li><button class="mitem" data-open="${esc(m.id)}" aria-current="${S.sel === m.id}">

    <span class="l1">${esc(deckLabel(m))}</span>
    <span class="l2">${fmtDate(m.date)} · contre ${esc(a ? a.name : (m.opp && m.opp.name) || 'adversaire')}${m.turns ? ` · ${esc(m.turns)} tours` : ''}${m.source === 'manuel' ? ' · saisie manuelle' : m.source === 'captures' ? ' · captures' : importName(m) ? ` · import « ${esc(importName(m))} »` : ''}</span>
  </button></li>`;
}

  const f = $('m-filters');

  const list = all.filter(m => (S.resFilter === 'all' || m.result === S.resFilter) && (!S.deckFilter || deckKey(m) === S.deckFilter));
  $('m-list').innerHTML = !S.ready.m ? '<li class="empty">Chargement…</li>' : list.length ? list.map(matchItem).join('') : `<li class="empty">${all.length ? 'Aucune partie ne correspond.' : 'Aucune partie pour l\'instant.'}</li>`;

  const m = all.find(x => x.id === S.sel);
  $('m-detail').innerHTML = m ? detailHtml(m) : `<div class="panel"><p class="empty">${S.ready.m ? (all.length ? 'Sélectionne une partie.' : 'Aucune partie pour l\'instant : la première arrivera avec ton prochain envoi de replays.') : 'Chargement…'}</p></div>`;
}
const CERT = { seen: 'Lu tel quel : dans le replay, ou sur une capture pour les anciennes parties', forced: 'Déduit : une seule explication possible', likely: 'Explication la plus probable', guess: 'Supposition' };
function certNum(c) { const v = Math.round(Number(c)); return c == null || c === '' || isNaN(v) ? null : Math.max(0, Math.min(100, v)); }
function cert(c) {
  const v = certNum(c); if (v == null) return '';
  const k = v >= 100 ? 'seen' : v >= 85 ? 'forced' : v >= 60 ? 'likely' : 'guess';
  return `<span class="cert ${k}" title="${CERT[k]}">${v === 100 ? 'lu' : v + ' %'}</span>`;

  const W = 520, H = 140, P = { l: 28, r: 10, t: 10, b: 22 };
  const ys = chrono.map(mistakeWeight), max = Math.max(4, ...ys);
  const x = i => P.l + (W - P.l - P.r) * (chrono.length === 1 ? 0 : i / (chrono.length - 1));
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  const pts = ys.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ticks = [0, Math.round(max / 2), max];
  const last = ys.length - 1;
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gravité des erreurs par partie">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    <polygon points="${x(0)},${y(0)} ${pts} ${x(last)},${y(0)}" fill="var(--warn)" opacity=".15"/>
    <polyline points="${pts}" fill="none" stroke="var(--warn)" stroke-width="2"/>
    ${ys.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === last ? 4.5 : 2.5}" fill="${chrono[i].result === 'V' ? 'var(--win)' : chrono[i].result === 'D' ? 'var(--loss)' : 'var(--muted)'}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(fmtDate(chrono[i].date))} · ${esc(RES[chrono[i].result] || '')} · gravité ${v}</title></circle>`).join('')}
    <text x="${P.l}" y="${H - 4}">1re partie</text><text x="${W - P.r}" y="${H - 4}" text-anchor="end">dernière</text>
  </svg><div class="legend" style="margin-top:6px"><span><i style="background:var(--win)"></i>Victoire</span><span><i style="background:var(--loss)"></i>Défaite</span></div></div>`;
}

/* Savoir */
function knHtml(k) {
  const ev = arr(k.evidence);
  return `<div class="kn"><div class="h"><b>${esc(k.subject)}</b><span class="badge ${STATUS[k.status] || ''}">${esc(k.status || '')}</span>${k.source ? `<span class="small muted">${esc(k.source)}</span>` : ''}</div>
    <p>${esc(k.text)}</p>${arr(k.cards).length ? chips(k.cards) : ''}
    ${ev.length ? `<span class="small muted">Vu dans : ${ev.map(id => { const m = S.matches.find(x => x.id === id); return m ? `<button class="linkish small" data-open="${esc(id)}">${fmtDate(m.date)}</button>` : esc(id); }).join(', ')}</span>` : ''}</div>`;
}
function renderSavoir() {
  const box = $('view-savoir');
  const kinds = Object.keys(KIND).filter(k => S.know.some(x => x.kind === k));
  const q = S.kSearch.toLowerCase();
  const list = S.know.filter(k => (S.kindFilter === 'all' || k.kind === S.kindFilter) && (!q || (String(k.subject) + ' ' + String(k.text)).toLowerCase().includes(q)));
  const groups = Object.keys(KIND).map(kind => [kind, list.filter(k => k.kind === kind)]).filter(([, l]) => l.length);
  const prev = $('k-search'); const hadFocus = prev && document.activeElement === prev;
  box.innerHTML = `<div class="panel sec stack">
    <div class="sec-head"><h2>Ce que l'on sait du jeu</h2><p>Règles du jeu, comportements observés et hypothèses à vérifier. Une hypothèse devient confirmée après plusieurs parties qui vont dans le même sens.</p></div>
    <div class="row"><button class="chip" data-kind="all" aria-pressed="${S.kindFilter === 'all'}">Tout</button>${kinds.map(k => `<button class="chip" data-kind="${k}" aria-pressed="${S.kindFilter === k}">${esc(KIND[k])}</button>`).join('')}
      <input class="input" id="k-search" type="search" placeholder="Chercher" aria-label="Chercher dans le savoir" style="max-width:240px" value="${esc(S.kSearch)}"></div>
    ${!S.ready.k ? '<p class="empty">Chargement…</p>' : groups.length ? groups.map(([kind, l]) => `<div><h3 style="margin-top:8px">${esc(KIND[kind])}</h3>${l.sort((a, b) => String(a.subject).localeCompare(String(b.subject), 'fr')).map(knHtml).join('')}</div>`).join('') : '<p class="empty">Rien ne correspond.</p>'}
  </div>`;
  box.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { S.kindFilter = b.dataset.kind; renderSavoir(); }));
  const s = $('k-search'); s.addEventListener('input', e => { S.kSearch = e.target.value; renderSavoir(); });
  if (hadFocus) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ---------- Screenshots of older matches ---------- */
function openZoom(src) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'lightbox'; b.setAttribute('aria-label', 'Fermer la capture');
  b.innerHTML = `<img src="${esc(src)}" alt="">`;
  const close = () => { b.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  b.addEventListener('click', close); document.addEventListener('keydown', onKey);
  document.body.appendChild(b); b.focus();
}

boot();
})();
</script>
